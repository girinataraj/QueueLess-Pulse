apply plugin: 'com.android.application'

def stagingOrigin = System.getenv('QUEUELESS_STAGING_ORIGIN') ?: ''
if (stagingOrigin && !(stagingOrigin ==~ /https:\/\/[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?\.[a-z]{2,63}/)) {
    throw new GradleException('QUEUELESS_STAGING_ORIGIN must be a public HTTPS origin without credentials or path')
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('staging') } && !stagingOrigin) {
    throw new GradleException('A verified, approved QUEUELESS_STAGING_ORIGIN is required for a connected build')
}
def signingPath = System.getenv('QUEUELESS_ANDROID_KEYSTORE')

android {
    namespace = "io.github.girinataraj.queuelesspulse"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.girinataraj.queuelesspulse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    flavorDimensions += "environment"
    productFlavors {
        verification {
            dimension "environment"
            applicationIdSuffix ".verification"
            resValue "string", "app_name", "QueueLess Installation Check"
            buildConfigField "String", "BACKEND_ORIGIN", '""'
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "QueueLess Pulse Staging"
            buildConfigField "String", "BACKEND_ORIGIN", '"' + stagingOrigin + '"'
        }
    }
    signingConfigs {
        evaluation {
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('QUEUELESS_ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'queueless-evaluation'
                keyPassword System.getenv('QUEUELESS_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            debuggable false
            if (signingPath) signingConfig signingConfigs.evaluation
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('exportRuntimeDependencies') {
    doLast {
        def packages = configurations.verificationReleaseRuntimeClasspath.incoming.resolutionResult.allComponents.collect { component ->
            def id = component.id
            id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier ?
                [name: id.group + ':' + id.module, version: id.version] : null
        }.findAll { it != null }.unique().sort { a, b -> a.name <=> b.name }
        def destination = new File(rootProject.projectDir, '../../evidence/android/runtime-packages.json')
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(packages))
        println('Exported ' + packages.size() + ' resolved public Maven packages for security verification')
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
