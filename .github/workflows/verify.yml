name: Universal verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: queueless_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: queueless_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U queueless_test -d queueless_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://queueless_test:isolated-ci-only@localhost:5432/queueless_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: python -m pip install pip==26.2.1 -r requirements-test.txt pip-audit==2.10.1
      - run: python -m playwright install --with-deps chromium
      - run: pnpm --dir frontend install --frozen-lockfile --strict-peer-dependencies
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/verify_secrets.py
      - run: pnpm --dir frontend run typecheck
      - run: pnpm --dir frontend run lint
      - run: pnpm --dir frontend run test --reporter=default --reporter=junit --outputFile=../evidence/frontend.xml
      - run: bash scripts/render-build.sh
      - run: pnpm --dir frontend audit --audit-level=low
      - run: python -m compileall -q app.py api.py demo_access.py rate_limit.py models.py config.py access.py universal.py tests scripts
      - run: python -m pytest -q --junitxml=evidence/ci.xml
      - name: Require zero failed or skipped backend/browser tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('evidence/ci.xml').getroot().find('testsuite')
          assert int(suite.attrib['tests']) >= 144
          assert all(suite.attrib[key] == '0' for key in ('failures', 'errors', 'skipped'))
          frontend = ET.parse('evidence/frontend.xml').getroot()
          cases = list(frontend.iter('testcase'))
          assert len(cases) >= 14
          assert all(case.find(tag) is None for case in cases for tag in ('failure', 'error', 'skipped'))
          PY
      - run: python -m pip_audit --format json --output evidence/ci-advisories.json
      - run: python scripts/verify_gunicorn.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: evidence/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Google retired the legacy tools package; sdkmanager is in cmdline-tools.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: pnpm --dir mobile install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm --dir mobile test
      - run: pnpm --dir mobile audit --audit-level=low
      - run: pnpm --dir mobile run sync
      - name: Native policy tests, lint and installation APK
        working-directory: mobile/android
        run: bash gradlew testVerificationDebugUnitTest lintVerificationRelease assembleVerificationDebug exportRuntimeDependencies --console=plain
      - run: python scripts/audit-android-dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            mobile/android/app/build/outputs/apk/verification/debug/*.apk
            mobile/android/app/build/test-results/
            mobile/android/app/build/reports/
            evidence/android/
