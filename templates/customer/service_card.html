<div class="card service-card"><span class="eyebrow">{{ service.branch.name }}</span><h3>{{ service.name }}</h3><p>{{ service.description or 'Join the queue without creating an account.' }}</p><p class="small-text">Approx. {{ service.average_minutes }} min per person{% if service.counter_label %} · {{ service.counter_label }}{% endif %}</p>
<form action="{{ url_for('join_queue',service_id=service.id) }}" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="request_key" value="{{ request_key() }}"><button class="btn btn-primary btn-block" type="submit">Join Queue</button></form></div>
