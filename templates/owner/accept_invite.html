{% extends 'base.html' %}
{% block content %}<div class="card auth-card"><span class="eyebrow">TEAM INVITATION</span><h2>Join {{ business.name }}</h2><p>Your service permissions will be assigned by the owner.</p><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if user %}<p>Accept as <strong>{{ user.username }}</strong>.</p>{% else %}<p>Already have an account? <a href="/staff/login">Sign in</a>, then reopen this link.</p><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="64" required><label for="email">Email (optional)</label><input id="email" name="email" type="email"><label for="password">Password</label><input id="password" name="password" type="password" minlength="12" maxlength="128" required><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required>{% endif %}<button class="btn btn-primary btn-block" type="submit">Accept invitation</button></form></div>{% endblock %}
